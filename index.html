<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지감모 - 지성이면 감천, 마음이 모이는 곳</title>
    <style>
        /* [전체 배경 설정] 부드러운 아이보리색 배경과 기본 글꼴을 설정합니다 */
        body {
            background-color: #FDFBF7; /* 부드러운 아이보리색 */
            color: #333333;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* [상단 메뉴바 뼈대] 따뜻한 옐로우 색상을 칠합니다 */
        header {
            background-color: #FFD166; /* 따뜻한 옐로우 */
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* [사이트 이름] 오렌지색으로 크고 눈에 띄게 만듭니다 */
        header h1 {
            margin: 0;
            color: #D35400; /* 조금 진한 오렌지색 */
            font-size: 32px;
        }

        /* [메뉴 버튼들] */
        nav {
            margin-top: 15px;
        }
        nav a {
            text-decoration: none; /* 밑줄 없애기 */
            color: #555555;
            font-weight: bold;
            margin: 0 15px;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 25px; /* 둥근 버튼 모양 */
            transition: 0.3s;
        }

        /* [메뉴 버튼에 마우스를 올렸을 때] 메인 오렌지색으로 변합니다 */
        nav a:hover {
            background-color: #FF9F1C; /* 따뜻한 메인 오렌지색 */
            color: white;
        }

        /* [메인 환영 화면] */
        .hero {
            text-align: center;
            padding: 80px 20px;
        }
        .hero h2 {
            color: #FF9F1C; /* 따뜻한 메인 오렌지색 */
            font-size: 38px;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 20px;
            line-height: 1.8;
            color: #555555;
        }

        /* [안내 박스] 감천2동 주민을 위한 특별한 상자입니다 */
        .notice-box {
            background-color: #FFE8D6; /* 아주 연한 오렌지 배경 */
            border: 2px solid #FF9F1C; /* 오렌지색 테두리 */
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 50px auto 0 auto;
            text-align: center;
        }
        .notice-box h3 {
            color: #D35400;
            margin-top: 0;
            font-size: 24px;
        }
        .notice-box p {
            font-size: 18px;
            margin-bottom: 0;
        }

        /* [맨 아래 정보칸] */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #FFF3E0;
            color: #888888;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- 1. 상단 메뉴바 부분입니다 -->
    <header>
        <h1>지감모</h1>
        <nav>
            <!-- 아래 3개의 링크가 01.html, 02.html, 03.html 파일과 연결됩니다 -->
            <a href="01.html">지감모 소개</a>
            <a href="02.html">참여 안내</a>
            <a href="03.html">후원 안내</a>
        </nav>
    </header>

    <!-- 2. 화면 가운데 메인 내용입니다 -->
    <div class="hero">
        <h2>지성이면 감천, 마음이 모이는 곳</h2>
        <p>따뜻한 마음을 나누는 부산 감천2동 봉사단체 <strong>'지감모'</strong>에 오신 것을 환영합니다.<br>
        우리 마을의 작은 정성이 모여 큰 기적을 만듭니다.</p>

        <!-- 감천2동 주민 안내 상자 -->
        <div class="notice-box">
            <h3>🧡 감천2동 주민 여러분을 환영합니다!</h3>
            <p>지감모는 감천2동 주민분들을 멤버로 모시고 있습니다.<br>
            함께 따뜻한 동네를 만들어갈 이웃들의 참여를 기다립니다.</p>
        </div>
    </div>

    <!-- 3. 맨 아래 꼬리말 부분입니다 -->
    <footer>
        <p>© 2026 지감모 (부산 감천2동 봉사단체). All rights reserved.</p>
    </footer>

</body>
</html>
