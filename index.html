<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지감모 - 지성이면 감천, 마음이 모이는 곳</title>
    
    <!-- [폰트 가져오기] 따뜻한 느낌의 '고운돋움' 폰트를 구글에서 불러옵니다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        /* [전체 배경 및 폰트 설정] */
        body {
            background-color: #FDFBF7; /* 부드러운 아이보리색 */
            color: #333333;
            font-family: 'Gowun Dodum', sans-serif; /* 불러온 폰트 적용 */
            margin: 0;
            padding: 0;
        }

        /* [상단 메뉴바] */
        header {
            background-color: #FFD166;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 그림자 효과를 줘서 입체감을 살립니다 */
            position: relative;
            z-index: 10;
        }
        header h1 {
            margin: 0;
            color: #D35400;
            font-size: 32px;
            font-weight: bold;
        }
        nav {
            margin-top: 15px;
        }
        nav a {
            text-decoration: none;
            color: #555555;
            font-weight: bold;
            margin: 0 15px;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 25px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: #FF9F1C;
            color: white;
        }

        /* [새로 꾸민 메인 대문(Hero) 구역] */
        .hero {
            /* 
               아래 url('bg.jpg') 부분이 배경 사진이 들어가는 곳입니다.
               사진이 잘 보이도록 반투명한 살구색을 사진 위에 살짝 덮었습니다. 
            */
            background-image: linear-gradient(rgba(255, 232, 214, 0.85), rgba(253, 251, 247, 1)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 120px 20px; /* 위아래 여백을 넉넉히 줘서 시원하게 만듭니다 */
        }
        .hero h2 {
            color: #D35400;
            font-size: 42px;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 22px;
            line-height: 1.8;
            color: #444444;
        }

        /* [안내 박스] */
        .notice-box {
            background-color: #FFFFFF; /* 사진 위에서 눈에 띄게 하얀 배경 */
            border: 2px solid #FF9F1C;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 60px auto 0 auto;
            text-align: center;
            box-shadow: 0 4px 10px rgba(255, 159, 28, 0.2);
        }
        .notice-box h3 {
            color: #D35400;
            margin-top: 0;
            font-size: 24px;
        }
        .notice-box p {
            font-size: 18px;
            margin-bottom: 0;
        }

        /* [꼬리말] */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #FFF3E0;
            color: #888888;
        }
    </style>
</head>
<body>

    <!-- 상단 메뉴바 -->
    <header>
        <h1>지감모</h1>
        <nav>
            <a href="01.html">지감모 소개</a>
            <a href="02.html">활동 내역</a>
            <a href="03.html">후원 안내</a>
        </nav>
    </header>

    <!-- 배경 사진이 들어갈 메인 대문 -->
    <div class="hero">
        <h2>지성이면 감천, 마음이 모이는 곳</h2>
        <p>따뜻한 마음을 나누는 부산 감천2동 봉사단체 <strong>'지감모'</strong>에 오신 것을 환영합니다.<br>
        우리 마을의 작은 정성이 모여 큰 기적을 만듭니다.</p>

        <!-- 감천2동 주민 안내 상자 -->
        <div class="notice-box">
            <h3>🧡 감천2동 주민 여러분을 환영합니다!</h3>
            <p>지감모는 감천2동 주민분들을 멤버로 모시고 있습니다.<br>
            함께 따뜻한 동네를 만들어갈 이웃들의 참여를 기다립니다.</p>
        </div>
    </div>

    <!-- 꼬리말 -->
    <footer>
        <p>© 2026 지감모 (부산 감천2동 봉사단체). All rights reserved.</p>
    </footer>

</body>
</html>
