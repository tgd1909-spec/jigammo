<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지감모 - 지성이면 감천, 마음이 모이는 곳</title>
    
    <!-- [폰트 가져오기] 고운돋움(Gowun Dodum) 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. 기본 설정 및 디자인 시스템 색상 적용
           ========================================= */
        body {
            background-color: #FDFBF7; /* 부드러운 아이보리 */
            color: #333333;
            font-family: 'Gowun Dodum', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* PC 화면을 위한 중앙 정렬 및 최대 너비(1000px) 설정 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* =========================================
           2. 공통 헤더 (상단 메뉴바)
           ========================================= */
        header {
            background-color: #FFD166; /* 메인 옐로우 */
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            
            /* 로고와 메뉴를 양끝으로 배치하는 설정 */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            color: #D35400; /* 진한 오렌지 */
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
        }

        header .nav-links {
            display: flex;
            gap: 20px; /* 메뉴 사이 간격 */
        }

        header .menu-item {
            text-decoration: none;
            color: #555555;
            font-size: 18px;
            font-weight: bold;
            padding: 5px 10px;
            transition: all 0.3s ease;
        }

        /* 마우스를 올렸을 때의 메뉴 색상 */
        header .menu-item:hover {
            color: #FF9F1C; /* 메인 오렌지 */
        }

        /* 현재 머무는 페이지(활성화된 메뉴)의 디자인 */
        header .menu-item.active {
            color: #D35400; /* 진한 오렌지 */
            border-bottom: 3px solid #D35400; /* 진한 오렌지색 밑줄 */
        }

        /* =========================================
           3. 메인 콘텐츠 영역 (Hero 및 안내 박스)
           ========================================= */
        .hero {
            background-color: #FFE8D6; /* 연한 살구색 배경 */
            text-align: center;
            padding: 80px 20px;
            margin-top: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 159, 28, 0.1);
        }

        /* 공식 로고 이미지 설정 */
        .official-logo {
            max-width: 350px; /* 로고 최대 크기 제한 */
            width: 100%; /* 모바일에서는 화면에 맞게 줄어듦 */
            height: auto;
            margin-bottom: 30px;
            /* 흰색 배경을 가진 jpg 로고가 자연스럽게 스며들도록 하는 효과 */
            mix-blend-mode: multiply; 
        }

        .hero h2 {
            color: #D35400;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            color: #444444;
        }

        .hero strong {
            color: #FF9F1C; /* 강조 텍스트 메인 오렌지색 */
        }

        .notice-box {
            background-color: #FDFBF7; /* 박스 안쪽은 아이보리색으로 대비 */
            border: 2px solid #FF9F1C; /* 메인 오렌지색 테두리 */
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 40px auto 0 auto;
            text-align: center;
        }

        .notice-box h3 {
            color: #D35400;
            margin-top: 0;
            font-size: 24px;
        }

        .notice-box p {
            font-size: 18px;
            margin-bottom: 0;
        }

        /* =========================================
           4. 꼬리말 (Footer)
           ========================================= */
        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
            border-top: 1px solid #FFE8D6;
            color: #888888;
        }

        /* =========================================
           5. 모바일 반응형 설정 (스마트폰 화면)
           ========================================= */
        @media screen and (max-width: 768px) {
            header {
                flex-direction: column; /* 메뉴를 세로로 쌓기 */
                gap: 15px;
            }
            .hero {
                padding: 50px 20px;
                margin-top: 20px;
            }
            .hero h2 {
                font-size: 28px;
            }
            .hero p {
                font-size: 18px;
            }
            .official-logo {
                max-width: 250px; /* 모바일에서는 로고 크기를 조금 줄임 */
            }
        }
    </style>
</head>
<body>

    <!-- [공통 HTML 헤더 뼈대] -->
    <!-- 메인 랜딩 페이지(index.html)이므로 현재 01, 02, 03 메뉴에는 active 클래스가 없습니다. -->
    <header>
        <a href="index.html" class="logo">지감모</a>
        <div class="nav-links">
            <a href="01.html" class="menu-item">지감모 소개</a>
            <a href="02.html" class="menu-item">활동 내역</a>
            <a href="03.html" class="menu-item">후원 안내</a>
        </div>
    </header>

    <!-- 최대 너비 1000px를 유지해주는 컨테이너 -->
    <main class="container">
        
        <!-- 대문(Hero) 영역 -->
        <section class="hero">
            <!-- 사용자 업로드 로고가 들어가는 자리입니다 -->
            <img src="logo.jpg" alt="지감모 공식 로고" class="official-logo">
            
            <h2>지성이면 감천, 마음이 모이는 곳</h2>
            <p>따뜻한 마음을 나누는 부산 감천2동 봉사단체 <strong>'지감모'</strong>에 오신 것을 환영합니다.<br>
            우리 마을의 작은 정성이 모여 큰 기적을 만듭니다.</p>

            <!-- 감천2동 주민 안내 상자 -->
            <div class="notice-box">
                <h3>🧡 감천2동 주민 여러분을 환영합니다!</h3>
                <p>지감모는 감천2동 주민분들을 멤버로 모시고 있습니다.<br>
                함께 따뜻한 동네를 만들어갈 이웃들의 참여를 기다립니다.</p>
            </div>
        </section>

    </main>

    <!-- 꼬리말 -->
    <footer>
        <p>© 2026 지감모 (부산 감천2동 봉사단체). All rights reserved.</p>
    </footer>

</body>
</html>
